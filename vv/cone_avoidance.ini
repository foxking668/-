# vv 锥桶两段偏置调参文件。与 vv、image_params.txt 放在同一运行目录。
# 约500ms检查更新；动作开始后锁定本次参数，更新用于下一次动作。
# 第一段：左偏。pratio改变图像参考中心；min_error是控制误差，不是实测轮角/PWM。
left_pratio=0.65
left_min_error=30
left_duration_ms=500
left_speed=1

# 中间等待：正常道路巡线，车辆继续行驶。
wait_duration_ms=200
wait_speed=7

# 第二段：右偏。保留正常巡线所需的更大右转误差。
right_min_error=58
right_duration_ms=700
right_speed=3

# 结束强制偏置后继续视觉避障；此速度是上限，不能覆盖更低速度或停车。
post_duration_ms=5500
post_speed=7

# 已确认锥桶底部到达处理图像高度的此百分比后才启动。
# 45是待实车验证的初始值，不是由灰度录像完成的距离标定；越大越晚触发。
trigger_y_percent=45
