format_version=2
# 时间窗口进入 + 灰度视觉过桶换段；全部时间单位为毫秒。
# 正式 START 后首次图像控制调用为首圈时间原点。
# 4000~5000ms可由连续2帧灰度锥桶确认进入；5000ms仍未确认则时间兜底。
entry_time_ms=4500
entry_early_ms=500
entry_late_ms=500

# 锥桶区域统一速度，按用户批准设6；不修改普通巡线参数。
cone_zone_speed=6

# duration是强制打方向上限：到时切视觉引导；视觉不可用就停车，timeout不跳段。
# error为控制误差幅度，不是实测轮角或PWM。方向固定为左、右、左、右回路。
first_left_duration_ms=200
first_left_timeout_ms=2500
first_left_error=30
second_right_duration_ms=200
second_right_timeout_ms=2500
second_right_error=58
third_left_duration_ms=200
third_left_timeout_ms=2500
third_left_error=30
return_right_duration_ms=200
return_right_timeout_ms=2500
return_right_error=58
wait_duration_ms=0

# 第四段确认道路稳定后即开放环岛；以下仅为后续速度上限窗口。
post_duration_ms=5500
post_speed=7

# 灰度识别和过桶判据初值，必须结合新实跑校准。
entry_y_percent=45
pass_near_y_percent=75
return_center_tolerance_percent=20
gray_threshold_percent=55
gray_min_contrast=12
gray_min_area_80x60=5
gray_taper_percent=80
