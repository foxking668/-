# 人行横道独立验证 VV17_ZEBRA_TEST_1
# 只控制横道：普通巡线/舵机/电机PID参数仍来自 image_params.txt。
# 本文件启动时严格读取；修改后必须退出并重新运行，不在制动途中热切换。
# 不允许重复键/未知键/非有限数值/越界数值，错误时拒绝启动。
# 所有比值是当前【裁剪后的原始二值图】坐标比例，不是原始录像像素。
# y=0为顶部，y=1为底部。调参初值不等于实车标定完成。
# 阴影补偿：9=每行用上下共9行窗口估计局部Otsu，0=完全沿用原ROI单阈值。
# 针对提供的实拍中近处白路面在阴影中被全局阈值判黑的问题。
# 仅本独立程序启用；巡线与横道共享同一份补偿后的原始二值图，闭运算仍只用于找道路。
# 取值0或3..25奇数；较小更局部但抖动可能增加。修改后重启。
illumination_band_rows=9

# ---------- 1. 远近观察区：先调区域，再调特征 ----------
# 远区15%~55%高度用于预警/接近减速；没有条纹组合不靠黑色面积单独预警。
far_top=0.15
far_bottom=0.55
# 近区30%~92%高度用于确认；范围必须位于0..1，top小于bottom。
near_top=0.30
near_bottom=0.92
# 道路左右边界各向内缩道路宽度的3.5%，并且至少1像素。
# 太大可能截掉边上的条纹；太小可能把外侧黑背景算入。
road_margin=0.035

# ---------- 2. 多行黑条＋白间隔 ----------
# 每行黑条宽度/当行有效道路宽度。至少保留2像素，排除孤立黑点。
run_min=0.025
run_max=0.28
# 黑条间白色间隔的最小道路宽度比例，至少1像素。
gap_min=0.018
# 一组条纹内最大/最小间隔、最大/最小黑条宽度比；越小越严格。
# 透视和斜入需要一定宽容；不要只靠无限放大这两个值解决漏检。
gap_ratio_max=3.0
width_ratio_max=3.0
# 黑像素/有效道路像素；单行占比须在此范围内。
black_min=0.10
black_max=0.70
# 区域白像素与黑像素的灰度均值差，0..255；低对比候选不触发。
contrast_min=20
# 合格行条纹组中心横移/纵向行差的最大绝对斜率。
max_slope=1.4
# 左右条纹外缘随y展开的斜率差；倒Y两侧向外发散，平行条纹更接近。
# 太小会拒绝透视/斜入，太大会放过分叉；结合BRANCH_DIVERGENCE日志调整。
max_direction_spread=0.8
# 至少3根黑条；相邻有效行至少2行，强近区至少3行。
min_stripes=3
min_rows=2
strong_rows=3

# ---------- 3. 连续确认与停车位置 ----------
# 均为连续有效处理帧，不是录像抽样帧；中途不成立会清零。
far_frames=2
near_frames=2
# 未见远区时，近区必须更强且连续满足3帧，才允许兜底。
fallback_frames=3
# 最近合格条纹行到达图高48%后才触发；增大=更晚制动，减小=更早。
# 必须用本车速度和镜头位置实测车头停在横道前，不代表固定厘米距离。
trigger_y=0.48
# 远区候选成立后速度上限；单位沿用原 motor_aim_speed/编码器RPS约定。
# 普通巡线更慢时不会被提高到该值。
approach_speed=7
# 接近候选连续消失1500ms后取消限速，恢复原巡线目标。
candidate_timeout_ms=1500

# ---------- 4. 右轮反转制动：用户明确指定，左轮始终输出0 ----------
# PWM单位沿用VV17 sysfs驱动，不能换成其他车的direct duty值。
# 12000和800ms来自本次vv(17)/02参数；不是新标定结论。
# 反转前先输出双轮0，等待coast_ms，再通过原驱动写右轮负PWM。
reverse_pwm=12000
coast_ms=50
# 反转计时从输出成功确认起算，编码器接近零可提前结束。
# max是反转上限，不会在速度未归零时无限反转；随后进入双轮0等待。
reverse_min_ms=50
reverse_max_ms=800
# 左右编码器速度绝对值均小于该阈值，并持续stationary_ms，才判为停稳。
# 零速阈值单位为VV17 RPS约定；数据读取失败不视作0。
stationary_rps=0.4
stationary_ms=200
# 双轮0后4000ms仍未满足停稳确认：锁存SETTLE_TIMEOUT，需退出检查再启动。
settle_timeout_ms=4000
# 从【停稳确认】开始保持至少3秒；中间车轮重新运动会重新确认和计时。
hold_ms=3000

# ---------- 5. 起步驶离、防止同一横道反复停车 ----------
# 起步后须实际测到轮子运动，保护时间结束且横道连续消失，才重新使能。
rearm_min_ms=1500
absent_ms=400
# 无效图像、无效道路区域、断帧不能累计“横道消失”。
# 恢复起步前至少连续3帧有效；不使用比赛圈数及每圈7秒屏蔽。
resume_valid_frames=3

# ---------- 6. 输入及执行异常 ----------
# 图像采集时间距离当前时间超过350ms：CAMERA_STALE，双轮0并锁存故障。
# 控制循环超过200ms未更新：CONTROL_LOOP_STALE。
input_timeout_ms=350
speed_timeout_ms=200
# 有图但短时巡线失效先输出双轮0；连续有效resume_valid_frames帧后恢复。
# 连续丢线超过1500ms则锁存LANE_LOSS_TIMEOUT，需退出检查。断帧仍按CAMERA_STALE处理。
lane_loss_timeout_ms=1500
# 控制线程启动后5秒仍未取得连续有效图像：STARTUP_IMAGE_TIMEOUT。
# 防止摄像头阻塞或录像准备失败时无限停留WAITING但没有故障原因。
startup_timeout_ms=5000
# 可复用现有WonderEcho语音接口；失败记VOICE_FAILED，不伪称已经播报。
voice_enable=1

# ---------- 7. 同步记录 ----------
# 默认原图与诊断图各10fps，控制/图像处理本身不被此帧率限制。
# 录像按采集时间抽帧；播放时间不等于真实时间，以video_timestamps.csv为准。
video_fps=10
# 每路录像最多排队4帧；满时丢录像帧并计数，不阻塞控制。
video_queue=4
# 状态日志最多2048条；满或写失败进入故障停车，防止无记录继续测试。
log_queue=2048
# 控制记录周期50ms；制动/停车覆盖周期另记控制行。图像记录每处理帧1行。
control_log_ms=50
# 后台写盘刷新周期；非控制线程执行。异常断电仍可能丢失末尾数据。
flush_ms=200
# 启动及运行时磁盘剩余空间下限(MiB)，不足则拒绝启动/故障停车。
minimum_free_mb=256
storage_check_ms=1000
