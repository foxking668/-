# The recorder uses config/hardware.ini for camera and encoder paths only.
# It does NOT initialize an IMU, motors, servo, voice or other vehicle outputs.
camera_width=1280
camera_height=720
camera_fps=20
sample_period_ms=20

# Shared-project board probe reports signed four-byte encoder payloads.
# The shared project's earlier board probe established a status-zero read ABI.
# Applies only to these configured encoder paths and signed four-byte payloads.
# Keep 0 for other/unverified drivers. Short/failed reads remain invalid.
factory_encoder_status_zero=1
encoder_left_format=i32le
encoder_right_format=i32le

# Blank sensor paths are UNCONFIGURED, never valid zero readings.
# Fill only after the actual wiring, driver and protocol are verified.
# u8: one byte, i16le: signed two-byte, i32le: signed four-byte little endian.
# text: numeric text node.
# This configuration does not implement I2C/UART/trigger-echo protocols.
gray_1_path=
gray_1_format=u8
gray_1_unit=raw_byte
gray_2_path=
gray_2_format=u8
gray_2_unit=raw_byte
gray_3_path=
gray_3_format=u8
gray_3_unit=raw_byte
gray_4_path=
gray_4_format=u8
gray_4_unit=raw_byte
# User confirmed first board placement was at front, second was at rear.
# Both IIO scale reads were 0.001000. Log raw counts without guessed calibration.
ultrasonic_front_path=/sys/bus/iio/devices/iio:device1/in_distance_raw
ultrasonic_front_format=text
ultrasonic_front_unit=raw_count
ultrasonic_rear_path=/sys/bus/iio/devices/iio:device2/in_distance_raw
ultrasonic_rear_format=text
ultrasonic_rear_unit=raw_count
