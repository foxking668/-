# The recorder uses config/hardware.ini for camera and encoder paths only.
# It does NOT initialize an IMU, motors, servo, voice or other vehicle outputs.
camera_width=1280
camera_height=720
camera_fps=20
sample_period_ms=20

# Blank sensor paths are UNCONFIGURED, never valid zero readings.
# Fill only after the actual wiring, driver and protocol are verified.
# u8: one raw byte, i16le: signed two-byte little endian, text: numeric text node.
# This configuration does not implement I2C/UART/trigger-echo protocols.
gray_1_path=
gray_1_format=u8
gray_1_unit=raw_byte
gray_2_path=
gray_2_format=u8
gray_2_unit=raw_byte
gray_3_path=
gray_3_format=u8
gray_3_unit=raw_byte
gray_4_path=
gray_4_format=u8
gray_4_unit=raw_byte
ultrasonic_front_path=
ultrasonic_front_format=text
ultrasonic_front_unit=
ultrasonic_rear_path=
ultrasonic_rear_format=text
ultrasonic_rear_unit=
