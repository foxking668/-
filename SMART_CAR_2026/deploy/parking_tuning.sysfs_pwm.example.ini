# VERSION 2026-10-16.3 SYSFS_PWM_COMPAT; existing XX-format tuning is accepted.
# Measured values: right=3370, center=4470, left=5170. Do not change these limits.
# New template intentionally centers all stages and disables all timed motion.
[session]
mode=single
stage=2
stage_2_step=first_bend
stage_4_step=second_bend
# speed only: 7.25 PID; counts are equivalent pulses per5ms (PPR1024).
# motor_raw_pwm: explicit10000-unit output ceiling;20..3500 ->100..17500ns.
# No raw factory-mode writes and no /dev/zf nodes are used.
motor_control=speed
motor_target_counts=40
motor_raw_pwm=1500
speed_left_cm_per_count=0
speed_right_cm_per_count=0

[stage_1]
servo_pwm=4470
settle_time_s=0.5
hold_time_s=0
motor_run_time_s=0
line_follow_enable=0
line_acquire_s=3
line_lost_s=0.35
# xx(1).zip steering defaults in native PWM units.
line_steer_kp=16
line_steer_kd=4
line_steer_deadband_px=1
line_steer_step_per_frame=120

[stage_2]
servo_pwm=4470
settle_time_s=0.5
hold_time_s=0
motor_run_time_s=0
correction_servo_pwm=4470
correction_hold_time_s=0

[stage_3]
servo_pwm=4470
settle_time_s=0.5
hold_time_s=0
motor_run_time_s=0

[stage_4]
servo_pwm=4470
settle_time_s=0.5
hold_time_s=0
motor_run_time_s=0
correction_servo_pwm=4470
correction_hold_time_s=0

[stage_5]
servo_pwm=4470
settle_time_s=0.5
hold_time_s=0
motor_run_time_s=0

[stage_6]
servo_pwm=4470
settle_time_s=0.5
hold_time_s=0
motor_run_time_s=0
