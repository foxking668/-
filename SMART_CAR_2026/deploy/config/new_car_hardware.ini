# 新车：来自 cc.zip 与 7.25 文件中一致的 define.hpp/Motor.cpp/Encoder.cpp。
# 专供 parking_rehearsal；不要用于旧 FactoryBoard 比赛主程序。
motor_backend=sysfs
factory_write_readback=0
motor_left_pwm=/sys/class/pwm/pwmchip8/pwm2/duty_cycle
motor_right_pwm=/sys/class/pwm/pwmchip8/pwm1/duty_cycle
motor_left_dir=/sys/class/gpio/gpio12/value
motor_right_dir=/sys/class/gpio/gpio13/value
motor_enable_gpio=/sys/class/gpio/gpio73/value
motor_left_forward_level=0
motor_right_forward_level=0
motor_period_ns=50000
motor_command_range=50000
# GPIO75/72只读方向；速度来自0x1611B000的0/3通道周期寄存器。
encoder_left=/sys/class/gpio/gpio75/value
encoder_right=/sys/class/gpio/gpio72/value
encoder_mode=delta
encoder_left_sign=1
encoder_right_sign=1
servo_pwm=/sys/class/pwm/pwmchip2/pwm0/duty_cycle
servo_period_ns=3040000
camera_device=/dev/video0
board_inputs_enabled=0
stop_key_index=-1
stop_switch_index=-1
beep_enabled=0
voice_enabled=0
imu_backend=none
