# 只修改本文件；运行中保存即授权直接执行，不需要R/C/再次Enter。
# 修改当前段角度/保持时间会打新角度并从写入成功重新计时；相同值/只改注释不重启。
# 保存执行最后一步到时间后回正、结束采集、询问Y/N，然后退出；下一次手动启动。
# single只调一个阶段；full按顺序走六段。stage是起始/重新选择的阶段(1..6)。
[session]
mode=single
stage=2
# first_bend从2A左弯开始，随后自动2B右修正；right_correction只测2B。
# 单独2B要求mode=single、stage=2；走完整六段用first_bend。
stage_2_step=first_bend
# second_bend从4A右弯开始，随后自动4B左修正；left_correction只测4B。
# 单独4B要求mode=single、stage=4；两个入口同时只选一个修正单独测试。
stage_4_step=second_bend

# steer_command是舵机命令，正数右打、负数左打，不是实测车轮角度。
# 范围-15..15且不得超过车辆配置上限。-10/+12及修正±5只是试值，不是最佳角度。
# settle_time_s：首次/手动切段写入后静止等待(0.5..5秒)；保存直接执行不等待。
# hold_time_s：保存执行后从角度写入成功起保持的秒数(0..120)。
# 第二阶段左打→右修正；第四阶段右打→左修正；最后一步计时结束才回正收尾。
# 首次/手动切段仍可用两次Enter；该路径保持时间从第二次Enter开始。
# 0关闭定时结束，需要Q结束；命令为0且时间大于0也会定时结束。
# P只暂停记录，保存仍执行、计时和自动反向修正继续；C只恢复记录。Q提前结束，仍询问Y/N。
# single到时结束；full仅在保存直接执行的试次到时结束，普通回车路径可继续切段。
# 修改stage直接选择并执行该阶段；只改其他阶段参数不影响当前段。
[stage_1]
# 前移：回正沿主线推到起倒点
steer_command=0
settle_time_s=0.5
hold_time_s=0
[stage_2]
# 第一倒弯：后拉倒向斜分支
steer_command=-10
settle_time_s=0.5
hold_time_s=5
# 第一倒弯后的右打修正，独立于第四阶段；+5/1秒仅为起始试值。
# 修正时间0关闭此动作；启用时本段必须左打，左右两段保持时间均大于0。
correction_steer_command=5
correction_hold_time_s=1
[stage_3]
# 分支直退：车身接近分支方向后直退
steer_command=0
settle_time_s=0.5
hold_time_s=0
[stage_4]
# 第二倒弯：反向打轮，使车身接入与主线平行的库轴
steer_command=12
settle_time_s=0.5
hold_time_s=5
# 第二倒弯后的左打修正，独立于第二阶段；-5/1秒仅为起始试值。
# 修正时间0关闭此动作；启用完整弯道时本段必须右打，两步保持时间均大于0。
correction_steer_command=-5
correction_hold_time_s=1
[stage_5]
# 库内直退：回正后退到人工确认的终点
steer_command=0
settle_time_s=0.5
hold_time_s=0
[stage_6]
# 停止确认：车身保持静止，记录终点图像和测距
steer_command=0
settle_time_s=0.5
hold_time_s=0
