# 2026-10-08.4；首次一次Enter：记录、设置舵机、静止等待后执行。
# 保存当前段参数即重新执行授权；P停电机并暂停，C只恢复记录，之后须Enter才运动。
# 时间到停电机、回正并记录停稳尾段；结束一次Y/N直接按键，下一次手动启动。
[session]
# 有电机动作/巡线必须single。full须关闭巡线且所有电机禁用，仅用于历史手推流程。
mode=single
stage=1
stage_2_step=first_bend
stage_4_step=second_bend
# 0未标定，只记录counts/s；实测后填厘米/计数，不使用默认轮周长。
speed_left_cm_per_count=0
speed_right_cm_per_count=0

# 电机幅值0..12000，且不得超过calibration_vehicle.ini中的pwm_limit。
# 2000/50000=4%PWM占空比，不是实际速度。左右可独立调；不填写负数。
# 阶段1前进、阶段2..5倒退、阶段6强制全0。
# motor_run_time_s：实际输出成功后运行上限0..120秒；0禁用电机。
# 舵机最后一步到时或电机总时间到时，先到者停机；反向修正不重启电机总计时。
# steer_command：负左、正右，±15且受车辆配置限制，是命令而非实测轮角。
# settle_time_s：写角度后静止等待0.5..5秒；电机模式保存重执行也等待。
# hold_time_s：动作允许后保持0..120秒；0关闭舵机定时。
# 成功记录主弯-10/+12、各5秒；反向修正默认关闭，可独立启用。
[stage_1]
# 前移起点/终点由你测量，记录本段持续时间，不假定斑马线位置。
steer_command=0
settle_time_s=0.5
hold_time_s=0
motor_left_command=2000
motor_right_command=2000
motor_run_time_s=0
# 阶段1巡线；电机时间为0时只观察记录、不自动转向/前进。
# 初始值用于低速试调，尚非实车标定结果。以下像素均指裁剪缩放后的160x82图。
line_follow_enable=1
# PD输出舵机命令：P单位命令/像素，D单位命令/(像素/秒)。先只调P。
line_kp=0.35
line_kd=0.02
# 远近趋势提前量0..1，直道先用0.25；滤波时间0.02..1秒，越大越平稳但反应越慢。
line_preview=0.25
line_filter_s=0.15
line_deadband_px=1
# 最大命令1..15且受车辆配置限制；每秒变化1..100，初始8和30。
line_max_command=8
line_slew_per_s=30
# 镜头居中时160像素图中心79.5。无可靠证据先不要靠改此项补机械回中。
line_target_x=79.5
# 使用原图纵向30%..95%，避开顶部物体和最底端；间距至少20%。
line_crop_top=0.30
line_crop_bottom=0.95
# 连续确认至少3帧且0.1秒；确认上限0.5..10秒。持续丢线0.05..0.5秒停车。
line_acquire_s=3
line_lost_s=0.35
# 黑线两侧最小灰度差8..80；线段最大宽4..40像素，宽黑块不当中心线。
line_min_contrast=16
line_max_width_px=26
[stage_2]
# 第一倒弯；可自动左打→右修正→零位，方向始终倒退。
steer_command=-10
settle_time_s=0.5
hold_time_s=5
correction_steer_command=5
correction_hold_time_s=0
motor_left_command=2000
motor_right_command=2000
motor_run_time_s=0
[stage_3]
# 分支直退；实际不需要此段时直接选stage=4。
steer_command=0
settle_time_s=0.5
hold_time_s=0
motor_left_command=2000
motor_right_command=2000
motor_run_time_s=0
[stage_4]
# 第二倒弯；可自动右打→左修正→零位。
steer_command=12
settle_time_s=0.5
hold_time_s=5
correction_steer_command=-5
correction_hold_time_s=0
motor_left_command=2000
motor_right_command=2000
motor_run_time_s=0
[stage_5]
# 库内直退；本工具不自动按超声波/虚线判断终点。
steer_command=0
settle_time_s=0.5
hold_time_s=0
motor_left_command=2000
motor_right_command=2000
motor_run_time_s=0
[stage_6]
# 只记录静止终点，禁止电机动作。
steer_command=0
settle_time_s=0.5
hold_time_s=0
motor_left_command=0
motor_right_command=0
motor_run_time_s=0
