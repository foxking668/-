# 只修改本文件；运行中保存即授权直接执行，不需要R/C/再次Enter。
# 修改当前段角度/保持时间会打新角度并从写入成功重新计时；相同值/只改注释不重启。
# 保存执行到时间后回正、结束采集、询问Y/N，然后退出；下一次由你手动启动。
# single只调一个阶段；full按顺序走六段。stage是起始/重新选择的阶段(1..6)。
[session]
mode=single
stage=2

# steer_command是舵机命令，正数右打、负数左打，不是实测车轮角度。
# 范围-15..15且不得超过车辆配置上限。±10只是起始试值，不是最佳角度。
# settle_time_s：首次/手动切段写入后静止等待(0.5..5秒)；保存直接执行不等待。
# hold_time_s：保存执行后从角度写入成功起保持的秒数(0..120)，到时回正并结束本次。
# 首次/手动切段仍可用两次Enter；该路径保持时间从第二次Enter开始。
# 0关闭定时结束，需要Q结束；命令为0且时间大于0也会定时结束。
# P只暂停记录，保存仍执行、计时继续；C只恢复记录。Q提前结束，仍询问Y/N。
# single到时结束；full仅在保存直接执行的试次到时结束，普通回车路径可继续切段。
# 修改stage直接选择并执行该阶段；只改其他阶段参数不影响当前段。
[stage_1]
# 前移：回正沿主线推到起倒点
steer_command=0
settle_time_s=0.5
hold_time_s=0
[stage_2]
# 第一倒弯：后拉倒向斜分支
steer_command=-10
settle_time_s=0.5
hold_time_s=5
[stage_3]
# 分支直退：车身接近分支方向后直退
steer_command=0
settle_time_s=0.5
hold_time_s=0
[stage_4]
# 第二倒弯：反向打轮，使车身接入与主线平行的库轴
steer_command=10
settle_time_s=0.5
hold_time_s=5
[stage_5]
# 库内直退：回正后退到人工确认的终点
steer_command=0
settle_time_s=0.5
hold_time_s=0
[stage_6]
# 停止确认：车身保持静止，记录终点图像和测距
steer_command=0
settle_time_s=0.5
hold_time_s=0
