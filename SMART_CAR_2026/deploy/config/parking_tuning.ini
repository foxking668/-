# 只修改本文件；终端不接受角度数值。修改后 P暂停、R预览、C恢复、Enter应用。
# single只调一个阶段；full按顺序走六段。stage是起始/重新选择的阶段(1..6)。
[session]
mode=single
stage=2

# steer_command是舵机命令，正数右打、负数左打，不是实测车轮角度。
# 范围-15..15且不得超过车辆配置上限。±10只是起始试值，不是最佳角度。
# settle_time_s：写入后静止等待(0.5..5秒)。
# hold_time_s：第二次Enter允许推车后保持转向的秒数(0..120)，到时自动回正。
# 0表示不启用定时回正。P只暂停记录，计时继续；回正不结束记录/不切阶段。
[stage_1]
# 前移：回正沿主线推到起倒点
steer_command=0
settle_time_s=0.5
hold_time_s=0
[stage_2]
# 第一倒弯：后拉倒向斜分支
steer_command=-10
settle_time_s=0.5
hold_time_s=5
[stage_3]
# 分支直退：车身接近分支方向后直退
steer_command=0
settle_time_s=0.5
hold_time_s=0
[stage_4]
# 第二倒弯：反向打轮，使车身接入与主线平行的库轴
steer_command=10
settle_time_s=0.5
hold_time_s=5
[stage_5]
# 库内直退：回正后退到人工确认的终点
steer_command=0
settle_time_s=0.5
hold_time_s=0
[stage_6]
# 停止确认：车身保持静止，记录终点图像和测距
steer_command=0
settle_time_s=0.5
hold_time_s=0
