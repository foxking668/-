# Defaults are conservative starting points, NOT actual vehicle calibration.
# Unlisted numeric settings use src/core.hpp defaults. Unknown/duplicate keys fail startup.
motion_calibrated=0
require_imu=1
imu_device=
imu_format=wit11
imu_baud=115200
imu_yaw_sign=1

wheel_circumference_m=0.20
wheelbase_m=0.18
encoder_ppr=1024
encoder_left_sign=1
encoder_right_sign=1
# New board uses factory pulse center in hardware.ini; remeasure vehicle alignment.
steer_offset_deg=0
steer_sign=1
steer_to_wheel_ratio=1
max_steer_deg=22
pwm_limit=12000
pid_kp=64
pid_ki=32
pid_kd=48

cruise_speed=0.25
cone_speed=0.12
ring_speed=0.10
cross_speed=0.08
parking_speed=0.06
black_v_max=85
black_s_max=100
white_v_min=140
white_s_max=85
blue_h_min=90
blue_h_max=135
blue_s_min=90
blue_v_min=35
line_min_confidence=0.35
confirm_frames=3
clear_frames=5

# ring_side=-1: left steering / positive CCW IMU yaw. +1: right / negative yaw.
ring_side=-1
ring_entry_bias_deg=12
ring_entry_distance_m=0.25
ring_min_yaw_deg=340
ring_max_yaw_deg=430
ring_min_travel_m=0.8
ring_exit_min_travel_m=0.15
ring_timeout_s=60

# Confirm interpretation with judges: 0=stop when bar seen, 1=stop every crossing.
stop_every_cross=0
cross_near_y_ratio=0.70
cross_stop_y_ratio=0.78
cross_stop_s=3.3
cross_pass_m=0.32
bar_roi_top=0.08
bar_roi_bottom=0.55
bar_span_ratio=0.45
bar_pixel_ratio=0.07

# Measure every garage distance and the outward axis angle on the actual course.
garage_depart_m=0.35
garage_min_after_cross_m=0.08
garage_outward_yaw_delta_deg=-30
garage_align_distance_m=0.12
garage_advance_m=0.25
garage_reverse_m=0.35
garage_align_tolerance=0.08
# Kept for old configuration compatibility; live camera uses hardware.ini camera_device.
camera_index=0
camera_width=1280
camera_height=720
process_width=320
process_height=240
