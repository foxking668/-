# 2026-10-06 independent calibration profile; NOT a validated driving profile.
# Keep motion_calibrated=0. Do not run the competition --drive mode.
# Wheel circumference, encoder PPR, PID and steering-to-wheel ratio remain UNVALIDATED.
# Positive forward encoder counts: hardware signs left +1/right -1; vehicle signs both +1.
# max_steer_deg is a command bound, not a measured wheel angle or mechanical limit.
# Factory LS2K0300 device-tree interfaces. Confirm the running board exposes them.
# Board writes returned status 0. Verify every typed PWM/GPIO write by readback.
# Only configured outputs use this policy; generic writes stay strict. Set 0 for strict mode.
# Readback is software evidence, NOT proof of physical waveform/stop; keep a hardware cutoff.
factory_write_readback=1
motor_left_pwm=/dev/zf_device_pwm_motor_1
motor_right_pwm=/dev/zf_device_pwm_motor_2
motor_left_dir=/dev/zf_driver_gpio_motor_1
motor_right_dir=/dev/zf_driver_gpio_motor_2
# Preserve controller/PID units: +/-50000 means +/-100% of each driver's duty_max.
# competition.ini pwm_limit=12000 therefore limits physical duty to 24%.
motor_command_range=50000
# User-reported new-car direction test: ASCII 0 forward, ASCII 1 reverse, BOTH wheels.
# This mapping does not prove the left motor can start; verify with wheels raised.
motor_left_forward_level=0
motor_right_forward_level=0

encoder_left=/dev/zf_encoder_1
encoder_right=/dev/zf_encoder_2
# Factory examples use per-read counts; verify read-and-clear behavior on the board.
# Board probe observed four-byte payloads; transport uses signed int32.
# For a verified wrapping cumulative counter select cumulative32, or cumulative16
# only if its four-byte payload is a sign-extended 16-bit counter. Do not guess.
encoder_mode=delta
encoder_left_sign=1
encoder_right_sign=-1
# competition.ini encoder_ppr must be actual counts PER WHEEL revolution,
# including gearing/quadrature, not necessarily the motor encoder's printed PPR.

servo_pwm=/dev/zf_device_pwm_servo
# Converted from factory 300 Hz / duty_max=10000: center 4470, left 5170, right 3370.
# These are factory starting values; reference angle is provisional, not measured.
servo_center_us=1490
servo_left_us=1723.333333
servo_right_us=1123.333333
servo_reference_deg=22

camera_device=/dev/video0
board_inputs_enabled=1
key_prefix=/dev/zf_driver_gpio_key_
switch_prefix=/dev/zf_driver_gpio_switch_
# 0..3 key and 0..1 switch; -1 disables that stop assignment.
stop_key_index=-1
stop_switch_index=-1
input_active_level=0
beep_enabled=1
beep_device=/dev/zf_driver_gpio_beep

# Factory bundle has no voice protocol; retain the existing WonderEcho protocol.
voice_enabled=1
voice_device=/dev/i2c-2
voice_address=52

# iio | serial | none. Serial keeps competition.ini imu_format/imu_baud.
imu_backend=none
# auto selects exactly ONE supported IMU by name, never ADC/ultrasonic devices.
# No match or multiple matches is a fault. Explicit verified paths remain supported.
imu_iio_device=auto
imu_gyro_axis=z
# 0: read IIO *_scale in rad/s per raw unit. If the driver does not expose scale,
# provide a VERIFIED degrees/s per raw-unit coefficient; no guessed fallback.
imu_gyro_scale_deg_s=0
imu_calibration_samples=100
imu_max_bias_deg_s=20
imu_max_stddev_deg_s=0.8
imu_serial_device=/dev/ttyS2
