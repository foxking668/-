# 2026-10-10.2；每次两次启动，第二次Enter后才执行和记录。
# 保存当前段参数即重新执行授权；P停电机并暂停，C只恢复记录，之后须Enter才运动。
# 时间到停电机、回正并记录停稳尾段；结束一次Y/N直接按键，下一次手动启动。
[session]
# 有电机动作/巡线必须single。full须关闭巡线且所有电机禁用，仅用于历史手推流程。
mode=single
stage=1
stage_2_step=first_bend
stage_4_step=second_bend
# 只调这一个值控制全部阶段快慢：左右轮共用，单位转/秒；0输出零PWM。
motor_target_rps=9
# 以下先沿用cc原参数；PWM限幅可自由改到此车周期50000。
motor_pid_kp=64
motor_pid_ki=32
motor_pid_kd=48
motor_pid_pwm_limit=12000
# 新车直接记录rps；这两个旧计数换算字段保持0，不用于新车速度。
speed_left_cm_per_count=0
speed_right_cm_per_count=0

# 新车启动脚本启用cc原代码的速度PID，每50ms更新两路PWM。
# [session]的motor_target_rps是唯一快慢调参，范围0..100转/秒；方向由阶段决定。
# motor_left/right_command：兼容旧字段，非零启用对应轮，0禁用；旧3000只作启用，不固定输出3000。
# motor_pid_kp/ki/kd：原代码64/32/48，初期沿用；motor_pid_pwm_limit为PWM纳秒限幅。
# 原代码限幅12000；可以自由改100..50000，不锁2000。50000等于此车PWM周期。
# 9rps是cc原车运行目标，不是本车停车最佳速度；低速停车只改motor_target_rps即可。
# 阶段1前进、阶段2..5倒退、阶段6强制全0。
# motor_run_time_s：实际输出成功后运行上限0..120秒；0禁用电机。
# 舵机最后一步到时或电机总时间到时，先到者停机；反向修正不重启电机总计时。
# steer_command：负左、正右，±15且受车辆配置限制，是命令而非实测轮角。
# settle_time_s：写角度后静止等待0.5..5秒；电机模式保存重执行也等待。
# hold_time_s：动作允许后保持0..120秒；0关闭舵机定时。
# -10/+12和5秒是旧车试调起点，新车需重新调；反向修正可独立启用。
[stage_1]
# 前移起点/终点由你测量，记录本段持续时间，不假定斑马线位置。
steer_command=0
settle_time_s=0.5
hold_time_s=0
motor_left_command=1
motor_right_command=1
motor_run_time_s=1
# 阶段1巡线；电机时间为0时只观察记录、不自动转向/前进。
# 初始值用于低速试调，尚非实车标定结果。以下像素均指裁剪缩放后的160x82图。
line_follow_enable=1
# PD输出舵机命令：P单位命令/像素，D单位命令/(像素/秒)。先只调P。
line_kp=0.35
line_kd=0.02
# 远近趋势提前量0..1，直道先用0.25；滤波时间0.02..1秒，越大越平稳但反应越慢。
line_preview=0.25
line_filter_s=0.15
line_deadband_px=1
# 最大命令1..15且受车辆配置限制；每秒变化1..100，初始8和30。
line_max_command=8
line_slew_per_s=30
# 镜头居中时160像素图中心79.5。无可靠证据先不要靠改此项补机械回中。
line_target_x=79.5
# 使用原图纵向30%..95%，避开顶部物体和最底端；间距至少20%。
line_crop_top=0.30
line_crop_bottom=0.95
# 连续确认至少3帧且0.1秒；确认上限0.5..10秒。持续丢线0.05..0.5秒停车。
line_acquire_s=3
line_lost_s=0.35
# 黑线两侧最小灰度差8..80；线段最大宽4..40像素，宽黑块不当中心线。
line_min_contrast=16
line_max_width_px=26
[stage_2]
# 第一倒弯；可自动左打→右修正→零位，方向始终倒退。
steer_command=-10
settle_time_s=0.5
hold_time_s=5
correction_steer_command=5
correction_hold_time_s=0
motor_left_command=1
motor_right_command=1
motor_run_time_s=0
[stage_3]
# 分支直退；实际不需要此段时直接选stage=4。
steer_command=0
settle_time_s=0.5
hold_time_s=0
motor_left_command=1
motor_right_command=1
motor_run_time_s=0
[stage_4]
# 第二倒弯；可自动右打→左修正→零位。
steer_command=12
settle_time_s=0.5
hold_time_s=5
correction_steer_command=-5
correction_hold_time_s=0
motor_left_command=1
motor_right_command=1
motor_run_time_s=0
[stage_5]
# 库内直退；本工具不自动按超声波/虚线判断终点。
steer_command=0
settle_time_s=0.5
hold_time_s=0
motor_left_command=1
motor_right_command=1
motor_run_time_s=0
[stage_6]
# 只记录静止终点，禁止电机动作。
steer_command=0
settle_time_s=0.5
hold_time_s=0
motor_left_command=0
motor_right_command=0
motor_run_time_s=0
