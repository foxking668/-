# VV15_AUTO_PARKING_20261017.2
# 本文件调入库，image_params.txt仍调原VV巡线。启动时读取本文件，修改后重新启动。
# 下列角度/PWM/时间是可运行的调参起点，不是本车实测成功入库参数。
[session]
# manual=单独入库：放车、启动、按一次Enter授权，直接识线进入阶段1，不等待斑马线。
# race=比赛：保持原巡航，第2次有效斑马线停车结束后进入阶段1；比赛入口自动起步。
start_mode=manual
# 0恢复原比赛巡航，不是总停车；manual必须保持1。
enabled=1
# 仅race生效，整数1..20；沿用vv15有效斑马线计数，manual忽略。
trigger_zebra_count=2
# 1=倒车仅右轮，左轮PWM=0；0=双轮倒车。阶段1始终双轮前进。
reverse_right_only=1
# 阶段1有效图像最长间隔0.05..0.5秒；等待重新起步识线0.5..10秒。
line_lost_s=0.35
line_acquire_s=3

# 各阶段：PWM=0或100..50000纳秒，时间允许小数，0..120秒。
# motor_run_time_s=0跳过该倒车阶段；阶段1和2必须大于0。
# settle_time_s=0.5..5秒：阶段2..5停车设置方向后等待，不占电机时间；阶段1/6保留字段不使用。
# steer_command=-90..90，沿用VV负左正右的代码约定；不是前轮实际角度。
# hold_time_s=0：阶段2..5全程保持主转向；>0到时修正或回正。阶段1必须0，阶段6是停车记录时间。
# 修正结束后回正，电机可继续直退至本阶段总时间到；总时间必须覆盖两步转向。
[stage_1]
steer_command=0
settle_time_s=0.5
hold_time_s=0
motor_pwm_ns=9000
# 从前进的首笔非零PWM成功写入开始计时，不含回车等待、识线等待和比赛斑马线动作。
motor_run_time_s=4

# 阶段2主转向必须负数，修正开启时必须正数；修正时间0表示关闭。
# 示例主转向1秒+修正1秒+回正直退1秒=电机总时间3秒。
[stage_2]
steer_command=-40
settle_time_s=0.5
hold_time_s=1
motor_pwm_ns=12000
motor_run_time_s=3
# correction_steer_command=-90..90；correction_hold_time_s=0..120秒。
correction_steer_command=5
correction_hold_time_s=1

[stage_3]
steer_command=0
settle_time_s=0.5
hold_time_s=0
motor_pwm_ns=9000
# 当前不需要分支直退，直接跳过。
motor_run_time_s=0

# 阶段4启用时主转向必须正数，修正开启时必须负数。
[stage_4]
steer_command=12
settle_time_s=0.5
hold_time_s=1
motor_pwm_ns=9000
motor_run_time_s=2
correction_steer_command=-5
correction_hold_time_s=0.5

[stage_5]
steer_command=0
settle_time_s=0.5
hold_time_s=0
motor_pwm_ns=9000
motor_run_time_s=1

[stage_6]
steer_command=0
settle_time_s=0.5
# 停车后继续记录终点的秒数；确认结束仍保持停车，先关舵机再Ctrl+C退出。
hold_time_s=2
motor_pwm_ns=0
motor_run_time_s=0
